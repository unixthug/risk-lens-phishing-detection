<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>RiskLens — Checking…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    /* ── Design tokens — exact match to popup.html ── */
    :root {
      --bg:     #0b1220;
      --card:   #111827;
      --border: rgba(148,163,184,.14);
      --text:   #e5e7eb;
      --muted:  rgba(226,232,240,.58);
      --green:  #65CB00;
      --shadow: 0 14px 40px rgba(0,0,0,.50);
    }

    body.light-mode {
      --bg:     #f8fafc;
      --card:   #ffffff;
      --border: rgba(17,24,39,.10);
      --text:   #111827;
      --muted:  rgba(17,24,39,.50);
      --shadow: 0 14px 40px rgba(0,0,0,.08);
    }

    * { box-sizing: border-box; margin: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: background 180ms ease, color 180ms ease;
    }

    /* ── Card — same radius/border/shadow as popup ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 32px 28px 28px;
      width: 320px;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    /* ── Logo row ── */
    .logo-row {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .logo-row svg {
      width: 18px; height: 18px;
      flex-shrink: 0;
    }

    .logo-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── Spinner — uses brand green, matches popup ring weight ── */
    .spinner {
      width: 48px; height: 48px;
      border-radius: 50%;
      border: 3px solid rgba(101,203,0,.15);
      border-top-color: var(--green);
      animation: spin 0.75s linear infinite;
      margin: 4px 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Text ── */
    .title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -.1px;
      text-align: center;
    }

    .host {
      font-size: 11.5px;
      color: var(--muted);
      word-break: break-all;
      text-align: center;
      line-height: 1.35;
      max-width: 260px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Progress bar ── */
    .progress-track {
      width: 100%;
      height: 2px;
      background: rgba(148,163,184,.12);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 2px;
    }

    .progress-fill {
      height: 100%;
      width: 30%;
      background: var(--green);
      border-radius: 2px;
      opacity: .8;
      animation: sweep 1.5s ease-in-out infinite;
    }

    @keyframes sweep {
      0%   { transform: translateX(-200%); }
      100% { transform: translateX(450%); }
    }
  </style>
</head>
<body>
  <div class="card">

    <!-- Wordmark -->
    <div class="logo-row">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L3 6.5V12C3 16.55 6.84 20.74 12 22C17.16 20.74 21 16.55 21 12V6.5L12 2Z"
              fill="rgba(101,203,0,.15)" stroke="#65CB00" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M9 12l2 2 4-4" stroke="#65CB00" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="logo-label">RiskLens</span>
    </div>

    <!-- Spinner -->
    <div class="spinner"></div>

    <!-- Copy -->
    <div class="title">Checking site safety…</div>
    <div class="host" id="urlDisplay">—</div>

    <!-- Progress bar -->
    <div class="progress-track">
      <div class="progress-fill"></div>
    </div>

  </div>

  <script src="checking.js"></script>
</body>
</html>
